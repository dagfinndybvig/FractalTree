plugins {
    id 'com.android.application'
}

// FractalTree — a Processing sketch packaged as an Android app.
// The sketch itself is app/src/main/java/io/github/dagfinndybvig/fractaltree/TreeSketch.java
// (kept in sync with tree/tree.pde in the workspace root).
// processing-core.jar, sound.jar and jsyn are the Processing Android runtime
// and Sound library (LGPL) — prebuilt from FOSS sources, see ANDROID.md.
android {
    namespace 'io.github.dagfinndybvig.fractaltree'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.dagfinndybvig.fractaltree'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3.0-alpha'
    }

    signingConfigs {
        release {
            // Same keystore as the hand-built v1.0 APK, so updates install
            // over it without uninstalling.
            storeFile rootProject.file('../android-build/project/debug.keystore')
            storePassword 'android'
            keyAlias 'treekey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.6.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
