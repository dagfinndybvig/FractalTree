AuthorName: Dagfinn Dybvig
Name: Fractal Tree
Summary: A meditation app inspired by fractal geometry
Description: |-
    A quiet, meditative app inspired by fractal geometry. A recursive tree
    sways in a wind made of filtered noise, and pentatonic chimes ring as it
    breathes — the same gust signal drives what you see and what you hear.
    Tap anywhere to mute.

    Built with Processing. Free software under the MIT license.
